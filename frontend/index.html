<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring RAG Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h2>ADBOT</h2>
            <p>Intelligent System Monitoring Assistant</p>
        </header>

        <main class="chat-box" id="chat-box">
            <div class="message assistant">
                <div class="text">Hello! I am your AI monitoring assistant. How can I help you check the terminal systems today?</div>
            </div>
        </main>

        <form class="chat-input-area" id="chat-form">
            <input type="text" id="user-input" placeholder="Type your question (e.g. સિસ્ટમ કેવી છે?)..." autocomplete="off" />
            <button type="submit" id="send-button">Send</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
